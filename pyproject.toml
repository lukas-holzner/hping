[tool.poetry]
name = "hping"
version = "0.8.1"
description = "A simple CLI tool to ping HTTP servers"
authors = ["Lukas Holzner <git@lukas.lhal.de>"]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[tool.poetry.dependencies]
python = "^3.11"
httpx = {version = "^0.28", extras = ["http2"]}

[tool.poetry.group.dev.dependencies]
pytest = "^9.2"
pytest-cov = "^7.1"
pytest-mock = "^3.17"
black = "^26.10.1"
flake8 = "^7.5"
mypy = "^2.4"
isort = "^9.0.2"
pre-commit = "^4.7"

[tool.poetry.scripts]
hping = "hping.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314", "py315"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["hping"]

[tool.mypy]
python_version = "3.15"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.flake8]
max-line-length = 88
ignore = ["E203", "W503"]
