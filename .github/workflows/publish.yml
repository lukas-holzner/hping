name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch: # Allow manual triggering
    inputs:
      tag:
        description: "Git tag to publish (optional - uses latest if not specified)"
        required: false
        type: string

jobs:
  publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # Required for trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine tag to publish
        id: get-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            echo "Using manual tag: $TAG"
            git checkout "$TAG"
          elif [ "$EVENT_NAME" == "release" ]; then
            TAG="$RELEASE_TAG"
            echo "Using release tag: $TAG"
          else
            # Get the latest tag for fallback
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "Using latest tag: $TAG"
            if [ -n "$TAG" ]; then
              git checkout "$TAG"
            fi
          fi

          if [ -z "$TAG" ]; then
            echo "No tag found, cannot publish"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing tag: $TAG"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: |
          poetry install --no-interaction
          python -m pip install -U build twine

      - name: Verify version matches tag
        env:
          TAG_VERSION: ${{ steps.get-tag.outputs.tag }}
        run: |
          POETRY_VERSION=$(poetry version --short)
          # Remove 'v' prefix if present
          CLEAN_TAG_VERSION=${TAG_VERSION#v}

          echo "Poetry version: $POETRY_VERSION"
          echo "Tag version: $CLEAN_TAG_VERSION"

          if [ "$POETRY_VERSION" != "$CLEAN_TAG_VERSION" ]; then
            echo "Version mismatch! Poetry: $POETRY_VERSION, Tag: $CLEAN_TAG_VERSION"
            exit 1
          fi

      - name: Build distribution
        run: |
          poetry build

      - name: Check distribution
        run: |
          ls -la dist/
          python -m twine check dist/*

      - name: Mint API token
        id: mint-token
        run: |
          # retrieve the ambient OIDC token
          resp=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi")
          oidc_token=$(jq -r '.value' <<< "${resp}")

          # exchange the OIDC token for an API token
          resp=$(curl -X POST https://pypi.org/_/oidc/mint-token -d "{\"token\": \"${oidc_token}\"}")
          api_token=$(jq -r '.token' <<< "${resp}")

          # mask the newly minted API token, so that we don't accidentally leak it
          echo "::add-mask::${api_token}"

          # output the API token for the next step
          echo "api-token=${api_token}" >> "${GITHUB_OUTPUT}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ steps.mint-token.outputs.api-token }}
          packages-dir: dist/
          skip-existing: true
          verbose: true

      - name: Create release summary
        run: |
          echo "## Published to PyPI 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** https://pypi.org/project/hping/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'pip install hping' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
